[workspace]
resolver = "3"
members = ["halo2-proto", "halo2-cli"]
# The firmware targets thumbv8m/thumbv6m and has its own workspace + .cargo/config.toml.
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Legion112/screenbar-halo2-rs"
rust-version = "1.90"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
